<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet Connection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .offline-container {
            text-align: center;
            padding: 20px;
        }
        /* অ্যানিমেটেড ট্রেন বা সিগন্যাল আইকন */
        .train-icon {
            font-size: 64px;
            animation: bounce 1.5s infinite alternate;
            margin-bottom: 20px;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
        h2 {
            margin-bottom: 10px;
            color: #d9534f;
        }
        p {
            color: #666;
            font-size: 14px;
            max-width: 300px;
            margin: 0 auto 20px auto;
        }
        .retry-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .retry-btn:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="train-icon">🚂</div>
        <h2>No Internet Connection</h2>
        <p>You are currently offline. Please check your network connection to track live train updates.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
